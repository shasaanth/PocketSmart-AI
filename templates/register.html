{% extends "base.html" %}

{% block title %}
Register - PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Start creating personalized AI plans.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form action="/register"
              method="post"
              class="auth-form">


            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                minlength="6"
                required
            >


            <button type="submit"
                    class="primary-button full-width">

                Create Account

            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
